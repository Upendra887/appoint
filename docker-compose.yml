services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sai
      POSTGRES_PASSWORD: sai
      POSTGRES_DB: aarogya_247
    ports: ["5432:5432"]
    volumes: [aarogya-postgres:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  aarogya-postgres:
